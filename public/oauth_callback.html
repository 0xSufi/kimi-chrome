<!DOCTYPE html>
<html>
<head>
  <title>Dyspel - Authorization</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #faf9f5; }
    .container { text-align: center; color: #374151; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e5e7eb; border-top-color: #c96442; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Completing authorization...</p>
  </div>
  <script>
    // Send the redirect URL back to the service worker. The SW handler
    // expects `url` and replies with `{ ok, error? }`.
    if (chrome.runtime && chrome.runtime.sendMessage) {
      chrome.runtime.sendMessage({
        type: 'oauth_redirect',
        url: window.location.href,
      }, (response) => {
        if (response && response.ok) {
          document.querySelector('.container').innerHTML = '<p>Authorization complete! This tab will close shortly.</p>';
          setTimeout(() => window.close(), 1500);
        } else {
          document.querySelector('.container').innerHTML =
            '<p style="color: #dc2626">Authorization failed: ' + (response?.error || 'Unknown error') + '</p>' +
            '<p><a href="#" onclick="window.close()">Close this tab</a></p>';
        }
      });
    } else {
      document.querySelector('.container').innerHTML =
        '<p style="color: #dc2626">Authorization failed: chrome.runtime is unavailable.</p>';
    }
  </script>
</body>
</html>
